# Optional: local PostgreSQL for development. Not needed if PostgreSQL is installed directly.
# Start: docker compose up -d   Then use DATABASE_URL="postgresql://postgres:postgres@localhost:5432/exammentor?schema=public"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exammentor
    ports:
      - "5432:5432"
    volumes:
      - exammentor-pg:/var/lib/postgresql/data
volumes:
  exammentor-pg:
